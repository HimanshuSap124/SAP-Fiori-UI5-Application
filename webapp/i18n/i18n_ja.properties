# This is the resource bundle for fiori.ui5app

#Texts for manifest.json

#XTIT: Application name
appTitle=Fiori UI5アプリケーション

#YDES: Application description
appDescription=SAP Fioriアプリケーション。
#XTIT: Main view title
title=Fiori UI5アプリケーション

view1Text1 = これは、テキストがi18nファイルから取得されるSAP Fiori UI5アプリケーションのサンプルです。
view1Text2 = このアプリケーションでは、i18nプロパティファイルを使用して、地域または国固有の言語に応じて表示テキストを表示することを目指しています。
view1Text3 = ステップ 1 - これを実装するには、i18n フォルダー内に、i18n_<countryCode>.properties という命名規則に従って、複数の i18n プロパティ ファイルを作成します。
view1Text4 = 例えば、日本向けには i18n_ja.properties、フランス向けには i18n_fr.properties、インド向けには i18n_hi.properties を作成します。
view1Text5 = ステップ2 - 次に、manifest.jsonファイルのmodelsセクションで、i18nモデルでサポートされている言語とフォールバック言語を定義します。
view1Text6 = ステップ3 - 最後にテストするには、ブラウザのURLにクエリプロパティを追加します。ヒンディー語の場合は以下のようになります: ?sap-language=HI`