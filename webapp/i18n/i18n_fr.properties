# This is the resource bundle for fiori.ui5app

#Texts for manifest.json

#XTIT: Application name
appTitle=Application Fiori UI5

#YDES: Application description
appDescription=An SAP Fiori application.
#XTIT: Main view title
title=Fiori UI5 Application

view1Text1 = Il s'agit d'un exemple d'application SAP Fiori UI5 où le texte provient d'un fichier i18n.
view1Text2 = Dans cette application, nous visons à afficher le texte en fonction de la langue régionale ou spécifique au pays à l'aide de fichiers de propriétés i18n.
view1Text3 = Étape 1 - Pour mettre cela en œuvre, créez plusieurs fichiers de propriétés i18n dans le dossier i18n, en suivant la convention d'appellation : i18n_<codepays>.properties.
view1Text4 = Par exemple, créez i18n_ja.properties pour le Japon, i18n_fr.properties pour la France et i18n_hi.properties pour l'Inde.
view1Text5 = Étape 2 - Maintenant, définissez la langue prise en charge par le modèle i18n et la langue de repli dans la section models du fichier manifest.json.
view1Text6 = Étape 3 - Enfin, pour tester, ajoutez la propriété de requête à l'URL du navigateur, comme ci-dessous pour l'hindi : ?sap-language=HI