# This is the resource bundle for fiori.ui5app

#Texts for manifest.json

#XTIT: Application name
appTitle=फियोरी यूआई5 एप्लिकेशन

#YDES: Application description
appDescription=एक SAP Fiori एप्लिकेशन।
#XTIT: Main view title
title=फियोरी यूआई5 एप्लिकेशन

view1Text1 = यह एक नमूना SAP Fiori UI5 एप्लिकेशन है जहां टेक्स्ट i18n फ़ाइल से आ रहा है।
view1Text2 = इस एप्लिकेशन में, हमारा उद्देश्य i18n प्रॉपर्टी फ़ाइलों का उपयोग करके क्षेत्रीय या देश-विशिष्ट भाषा के अनुसार दृश्य पाठ प्रदर्शित करना है।
view1Text3 = चरण 1 - इसे लागू करने के लिए, i18n फ़ोल्डर में कई i18n प्रॉपर्टी फ़ाइलें बनाएँ, नामकरण परंपरा का पालन करते हुए: i18n_<countryCode>.properties।
view1Text4 = उदाहरण के लिए - जापान के लिए i18n_ja.properties, फ्रांस के लिए i18n_fr.properties और भारत के लिए i18n_hi.properties फ़ाइलें बनाएँ।
view1Text5 = चरण 2 - अब, manifest.json फ़ाइल के models सेक्शन में i18n मॉडल द्वारा समर्थित भाषा और फ़ॉलबैक भाषा को परिभाषित करें।
view1Text6 = चरण 3 - और अंत में, इसका परीक्षण करने के लिए, क्वेरी प्रॉपर्टी जोड़कर ब्राउज़र यूआरएल को संलग्न करें - जैसे कि नीचे हिंदी के लिए है: - `?sap-language=HI`