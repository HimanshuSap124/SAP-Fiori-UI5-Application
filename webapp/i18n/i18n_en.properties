#XTIT: Application name
appTitle=Fiori UI5 Application

#YDES: Application description
appDescription=An SAP Fiori application.
#XTIT: Main view title
title=Fiori UI5 Application

view1Text1 = This is a sample SAP Fiori UI5 Application where the Text is coming from i18n file.
view1Text2 = In this application, we aim to display view text according to the regional or country-specific language using i18n property files.
view1Text3 = Step 1 - To implement this, create multiple i18n property files in the i18n folder, following the naming convention: i18n_<countryCode>.properties.
view1Text4 = For example - create i18n_ja.properties for Japan, i18n_fr.properties for France, and i18n_hi.properties for India.
view1Text5 = Step 2 - Now, define i18n model supported language and fallback language in the models section on manifest.json file.
view1Text6 = Step 3 - And at last to test it, append the browser url by adding query property - like below is for Hindi :-  ?sap-language=HI`